# This is a Declarative Automation Bundle definition for cnpj_data_lakehouse_v3.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cnpj_data_lakehouse_v3
  uuid: 7d8bc4cf-6a86-4c9b-ac41-f0ad9c60e0ba

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:  
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  year_month:
    description: "Ano e mês de referência para criação da pasta no volume onde serão armazenados os dados baixados."
    default: '2026_10'
  target_dir:
    description: "Ano e mês da base de dados para download."
    default: '/2026-10'  
  
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true    
    workspace:
      host: https://dbc-b01fefa4-1f16.cloud.databricks.com
    variables:
      catalog: dev_cnpj_data_lakehouse_v3
      schema: bronze      
  staging:
    mode: production    
    workspace:
      host: https://dbc-b01fefa4-1f16.cloud.databricks.com
      root_path: /Workspace/Users/cleverson.rocha82@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: stg_cnpj_data_lakehouse_v3      
      schema: bronze      
    permissions:
      - user_name: cleverson.rocha82@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production    
    workspace:
      host: https://dbc-b01fefa4-1f16.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/cleverson.rocha82@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/cleverson.rocha82@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_cnpj_data_lakehouse_v3
      schema: bronze      
      
    permissions:
      - user_name: cleverson.rocha82@gmail.com
        level: CAN_MANAGE
