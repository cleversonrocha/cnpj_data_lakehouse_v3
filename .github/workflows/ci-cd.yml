name: Databricks Asset Bundle CI/CD

on:
  pull_request:
    branches: [develop, main]

  push:
    branches: [develop, main]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  # ETAPA 1: Integração Contínua (CI) - Validação de Sintaxe
  ci-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validar sintaxe do Bundle
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t staging
          databricks bundle validate -t prod

  # ETAPA 2: Entrega Contínua (CD) - Deploy, Testes e Promoção
  cd-deploy:
    needs: ci-validation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      # Fluxo para branch DEVELOP (Deploy Dev -> Testes -> Merge Staging -> Deploy Staging)
      - name: Deploy em Dev
        if: github.ref_name == 'develop'
        run: databricks bundle deploy -t dev

      - name: Executar Testes Unitários (Gate de Qualidade)
        if: github.ref_name == 'develop'
        run: databricks bundle run pytest_job -t dev

      - name: Merge develop into staging
        if: github.ref_name == 'develop' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "cleverson.rocha82@gmail.com"
          git fetch origin staging
          git checkout -B staging origin/staging
          git merge origin/develop --no-edit -m "chore(ci): promote develop to staging"
          git push origin staging

      - name: Publicar em Staging
        if: github.ref_name == 'develop' && success()
        run: databricks bundle deploy -t staging

      # Fluxo para branch MAIN (Deploy Prod após PR aprovado)
      - name: Deploy em Produção
        if: github.ref_name == 'main'
        run: databricks bundle deploy -t prod