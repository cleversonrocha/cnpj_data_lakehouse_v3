name: Databricks Asset Bundle CI/CD

on:
  pull_request:
    branches: [develop, staging, main]

  push:
    branches: [develop, staging, main]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  # ETAPA 1: Integração Contínua (CI) - Validação de Sintaxe
  ci-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validar sintaxe do Bundle
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t staging
          databricks bundle validate -t prod

  # ETAPA 2: Entrega Contínua (CD) - Deploy, Testes e Promoção
  cd-deploy:
    needs: ci-validation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy em Dev
        if: github.ref_name == 'develop'
        run: databricks bundle deploy -t dev

      - name: Abrir PR de develop para staging
        if: github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base staging --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base staging \
              --head develop \
              --title "chore(ci): promote develop to staging" \
              --body "Promoção automática de develop para staging. Revise os checks antes de fazer o merge."
          else
            echo "Já existe um PR aberto de develop para staging: #$pr_number"
          fi

      - name: Deploy em Staging
        if: github.ref_name == 'staging'
        run: databricks bundle deploy -t staging

      - name: Deploy em Produção
        if: github.ref_name == 'main'
        run: databricks bundle deploy -t prod
